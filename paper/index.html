<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta http-equiv="refresh" content="0; url=../">
    <link rel="canonical" href="../">
    <title>This edition has moved · The Schiffer and Pompeiu counterexamples</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #1b1a18; background: #fbfaf6; }
      main { width: min(680px, calc(100% - 44px)); padding: 42px; border-top: 2px solid #1b1a18; background: #f3f0e9; }
      h1 { margin: 0 0 18px; font: 500 clamp(34px, 7vw, 52px)/1.08 Georgia, "Times New Roman", serif; }
      p { max-width: 560px; margin: 0; color: #666159; line-height: 1.7; }
      a { color: #1b1a18; text-decoration-color: #4f5658; text-underline-offset: 4px; }
      a:focus-visible { outline: 3px solid #4f5658; outline-offset: 4px; }
    </style>
    <script>
      (() => {
        const destination = new URL("../", window.location.href);
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>This edition has moved.</h1>
      <p>The former paper edition has been folded into the joint exposition. If the redirect does not happen automatically, <a id="canonicalLink" href="../">continue to the canonical site</a>.</p>
    </main>
    <script>
      const link = document.getElementById("canonicalLink");
      const destination = new URL("../", window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      link.href = destination.href;
    </script>
  </body>
</html>
